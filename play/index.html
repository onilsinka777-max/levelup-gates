<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LevelUp">
<meta name="theme-color" content="#04050c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>LevelUp: Система</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #04050c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #04050c; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #bfe9ff; font: 600 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .08em; z-index: 5; background: radial-gradient(ellipse at 50% 40%, #0b1430 0%, #04050c 70%); }
  #boot h1 { margin: 0; font-size: 34px; letter-spacing: .32em; color: #fff; text-shadow: 0 0 18px #4fc3ff, 0 0 42px #1d6cff; }
  #boot .bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #10203c; overflow: hidden; box-shadow: 0 0 12px #1d6cff55; }
  #boot .fill { height: 100%; width: 0; background: linear-gradient(90deg, #4fc3ff, #9fe6ff); transition: width .2s; }
  #boot small { opacity: .65; letter-spacing: .04em; font-weight: 500; text-align: center; padding: 0 24px; }
  #turn { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10; background: #04050ce8; color: #fff; font: 600 18px/1.4 -apple-system, Roboto, sans-serif; text-align: center; padding: 24px; }
  #turn .ph { width: 56px; height: 92px; border: 3px solid #4fc3ff; border-radius: 12px; animation: rot 1.8s ease-in-out infinite; box-shadow: 0 0 16px #4fc3ff88; }
  @keyframes rot { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="boot"><h1>СИСТЕМА</h1><div class="bar"><div class="fill" id="fill"></div></div><small id="msg">Загрузка… в первый раз около минуты, дальше — быстро</small></div>
<div id="turn"><div class="ph"></div>Поверни телефон горизонтально<small style="opacity:.6;font-weight:500">игра — в горизонтальном виде</small></div>
<script>
  var canvas = document.getElementById("unity-canvas");
  var fill = document.getElementById("fill"), msg = document.getElementById("msg");
  var dpr = Math.min(window.devicePixelRatio || 1, /iPhone|iPad|Android/i.test(navigator.userAgent) ? 2 : 1.5);
  var config = {
    dataUrl: "Build/WebGL.data.unityweb?v=1701",
    frameworkUrl: "Build/WebGL.framework.js.unityweb?v=1701",
    codeUrl: "Build/WebGL.wasm.unityweb?v=1701",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "LevelUp",
    productName: "LevelUp: Система",
    productVersion: "2026.11.11",
    devicePixelRatio: dpr,
    showBanner: function (t, type) { if (type === "error") { msg.textContent = t; } }
  };
  var game = null;
  // вкладка в фоне — звук стоп (Антон: «сворачиваю сайт, а музыка продолжает играть»)
  document.addEventListener("visibilitychange", function () {
    try {
      var ctx = window.WEBAudio && WEBAudio.audioContext;
      if (ctx) { if (document.hidden) ctx.suspend(); else ctx.resume(); }
    } catch (e) {}
  });
  // файл данных больше 100 МБ (предел GitHub Pages) лежит частями: Build/parts.json → ["….part0", …]; собираем в один кусок в памяти
  function loadParts() {
    return fetch("Build/parts.json?v=1701", { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (j) {
      var list = j && (j.parts || j);
      if (!list || !list.length) return null;
      var got = new Array(list.length), sizes = new Array(list.length).fill(0), total = (j && j.total) || 0;
      function prog() { var s = 0; for (var i = 0; i < sizes.length; i++) s += sizes[i]; fill.style.width = Math.round(Math.min(.9, total ? s / total * .9 : 0) * 100) + "%"; }
      return Promise.all(list.map(function (name, i) {
        return fetch("Build/" + name).then(function (r) {
          if (!r.ok) throw new Error("часть " + name + ": " + r.status);
          var rd = r.body && r.body.getReader ? r.body.getReader() : null;
          if (!rd) return r.arrayBuffer().then(function (b) { sizes[i] = b.byteLength; prog(); got[i] = b; });
          var chunks = [];
          return (function pump() { return rd.read().then(function (x) { if (x.done) { got[i] = new Blob(chunks); return; } chunks.push(x.value); sizes[i] += x.value.length; prog(); return pump(); }); })();
        });
      })).then(function () { return URL.createObjectURL(new Blob(got)); });
    });
  }
  var s = document.createElement("script");
  s.src = "Build/WebGL.loader.js?v=1701";
  s.onload = function () {
    loadParts().then(function (u) { if (u) { config.dataUrl = u; msg.textContent = "Распаковка…"; } return go(); }).catch(function (e) { msg.textContent = "Не скачалось: " + e.message; });
  };
  function go() {
    return createUnityInstance(canvas, config, function (p) { fill.style.width = Math.round(90 + p * 10) + "%"; if (p >= .9) msg.textContent = "Пробуждение Системы…"; })
      .then(function (u) { game = u; var b = document.getElementById("boot"); b.style.transition = "opacity .5s"; b.style.opacity = 0; setTimeout(function () { b.remove(); }, 600); })
      .catch(function (e) { msg.textContent = "Не запустилось: " + e; });
  }
  document.body.appendChild(s);
</script>
</body>
</html>
